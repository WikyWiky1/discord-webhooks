name: Movie Muppet

on:
  schedule:
    # GitHub Actions cron is ALWAYS UTC.
    # Saturday 11:30 AM Chicago time:
    #   CDT (Mar–Nov, UTC-5)  ->  16:30 UTC
    #   CST (Nov–Mar, UTC-6)  ->  17:30 UTC
    # Both are scheduled; the script's timezone gate + last_run_date guard
    # ensure it only actually posts once per Saturday.
    - cron: '30 16 * * 6'
    - cron: '30 17 * * 6'

  # Manual "Suggest" button — Actions tab -> Movie Muppet -> Run workflow
  workflow_dispatch:
    inputs:
      force:
        description: 'Fire a movie suggestion right now (ignores the schedule)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# Needed so the job can commit movie_history.json back to the repo
permissions:
  contents: write

concurrency:
  group: movie-muppet
  cancel-in-progress: false

jobs:
  suggest:
    name: Suggest a movie
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Movie Muppet
        env:
          MOVIE_MUPPET_WEBHOOK: ${{ secrets.MOVIE_MUPPET_WEBHOOK }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FORCE_SUGGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: python movie_muppet.py

      - name: Commit updated history
        run: |
          if [[ -n "$(git status --porcelain movie_history.json)" ]]; then
            git config user.name  "movie-muppet[bot]"
            git config user.email "movie-muppet[bot]@users.noreply.github.com"
            git add movie_history.json
            git commit -m "🎬 Movie Muppet: update watch history [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "✅ History committed."
          else
            echo "ℹ️ No history changes to commit."
          fi
