name: Movie Muppet

on:
  schedule:
    # GitHub Actions cron is ALWAYS UTC, and scheduled runs are best-effort:
    # they're routinely delayed by hours (Sep 26: 11:30 run started at 2:17 PM)
    # or dropped entirely. So we take MANY shots — the script's gate and
    # last_run_date guard guarantee only ONE post per week no matter how many run.
    #
    # Saturday, hourly from 13:17 UTC:
    #   CDT (UTC-5): 8:17 AM -> 6:17 PM      CST (UTC-6): 7:17 AM -> 5:17 PM
    # (A CST 7:17 AM run is before the 8 AM slot and just skips.)
    - cron: '17 13-23 * * 6'
    # Catch-up, once a day Sunday–Friday (~10–11 AM CT). Only posts if
    # every Saturday run was dropped — late is better than never.
    - cron: '17 16 * * 0-5'

  # Manual "Suggest" button — Actions tab -> Movie Muppet -> Run workflow
  workflow_dispatch:
    inputs:
      force:
        description: 'Fire a movie suggestion right now (ignores the schedule)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# Needed so the job can commit movie_history.json back to the repo
permissions:
  contents: write

concurrency:
  group: movie-muppet
  cancel-in-progress: false

jobs:
  suggest:
    name: Suggest a movie
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # v6 targets Node 24 (v4 was Node 20 and is deprecated)
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      # v6 targets Node 24 (v5 was Node 20 and is deprecated)
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # Proves which version of the script the runner actually checked out.
      # If this warns, your edit never made it to the branch.
      - name: Verify deployed script
        run: |
          echo "── Commit: $(git rev-parse --short HEAD) ──"
          echo "── Payload return line: ──"
          grep -n 'return {' movie_muppet.py | tail -3
          if grep -q '"avatar_url"[[:space:]]*:' movie_muppet.py; then
            echo "⚠️  WARNING: avatar_url is STILL being sent in the payload."
          else
            echo "✅ No avatar_url in payload — Discord's own avatar will be used."
          fi
          if grep -q 'FIRE_HOUR_MAX' movie_muppet.py; then
            echo "⚠️  WARNING: OLD time-window gate still deployed — late runs will be skipped."
          else
            echo "✅ Catch-up gate deployed."
          fi

      - name: Run Movie Muppet
        env:
          MOVIE_MUPPET_WEBHOOK: ${{ secrets.MOVIE_MUPPET_WEBHOOK }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FORCE_SUGGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: python movie_muppet.py

      # Retries the pull/push because the other bots in this repo commit state
      # every few minutes. If this push were lost, last_run_date would be lost,
      # and the next hourly run would post a SECOND movie the same weekend.
      - name: Commit updated history
        run: |
          if [[ -z "$(git status --porcelain movie_history.json)" ]]; then
            echo "ℹ️ No history changes to commit."
            exit 0
          fi

          git config user.name  "movie-muppet[bot]"
          git config user.email "movie-muppet[bot]@users.noreply.github.com"
          git add movie_history.json
          git commit -m "🎬 Movie Muppet: update watch history [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✅ History committed (attempt ${attempt})."
              exit 0
            fi
            echo "⚠️ Push attempt ${attempt} failed — retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "❌ Could not push history after 5 attempts."
          exit 1
